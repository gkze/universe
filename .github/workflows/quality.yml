name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated dependency directories
        run: |
          printf '%s\n' \
            "MISE_DATA_DIR=$RUNNER_TEMP/mise" \
            "CARGO_HOME=$RUNNER_TEMP/cargo" \
            "RUSTUP_HOME=$RUNNER_TEMP/rustup" \
            "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"

      - name: Bootstrap Mise
        run: bin/seed.sh

      - name: Trust repository configuration
        run: bin/mise trust

      - name: Restore pinned tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.MISE_DATA_DIR }}/installs
            ${{ env.MISE_DATA_DIR }}/http-tarballs
            ${{ env.CARGO_HOME }}/bin
            ${{ env.RUSTUP_HOME }}
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-macos-26-${{ hashFiles('seed.zon', 'mise.toml', 'mise.dev.toml', 'packages/mise-apple-sdk/**/*.lua') }}

      - name: Restore Bun package downloads
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun-v1-${{ runner.os }}-${{ runner.arch }}-macos-26-${{ hashFiles('mise.toml', 'bun.lock') }}

      - name: Install pinned tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: bin/mise -E dev install

      - name: Run lint, formatting checks, and tests
        run: bin/mise -E dev run check

      - name: Compare shipped seed binaries
        run: bin/mise -E dev run check-seed-artifacts

      - name: Save pinned tools
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.MISE_DATA_DIR }}/installs
            ${{ env.MISE_DATA_DIR }}/http-tarballs
            ${{ env.CARGO_HOME }}/bin
            ${{ env.RUSTUP_HOME }}
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}

      - name: Save Bun package downloads
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
